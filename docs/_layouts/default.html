<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172b4d;
        --muted: #52647a;
        --accent: #176b87;
        --line: #dce5ed;
        --paper: #ffffff;
        --canvas: #f3f7fa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 17px/1.7 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        padding: 1rem max(1.25rem, calc((100% - 860px) / 2));
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      header a { color: var(--ink); font-weight: 700; text-decoration: none; }
      main {
        max-width: 860px;
        margin: 2rem auto;
        padding: clamp(1.25rem, 5vw, 3.5rem);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      h1, h2, h3 { line-height: 1.25; }
      h1 { font-size: clamp(2rem, 5vw, 3rem); }
      h2 { margin-top: 2.2rem; }
      a { color: var(--accent); }
      img { display: block; max-width: 100%; height: auto; margin: 1.5rem auto; }
      blockquote {
        margin: 1.5rem 0;
        padding: 0.75rem 1rem;
        border-left: 4px solid var(--accent);
        background: var(--canvas);
        color: var(--muted);
      }
      table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
      th, td { padding: 0.55rem 0.75rem; border: 1px solid var(--line); text-align: left; }
      th { background: var(--canvas); }
      code { padding: 0.12rem 0.3rem; background: var(--canvas); border-radius: 4px; }
      pre { padding: 1rem; overflow-x: auto; background: var(--canvas); }
      footer { max-width: 860px; margin: 0 auto 2rem; padding: 0 1.25rem; color: var(--muted); font-size: 0.9rem; }
      @media (max-width: 600px) {
        body { font-size: 16px; }
        main { margin: 1rem 0.5rem; border-radius: 8px; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      Proyecto académico. No usar como herramienta para aprobar o denegar créditos.
    </footer>
  </body>
</html>
